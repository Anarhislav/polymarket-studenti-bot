services:
  bot:
    build: .
    image: polymarket-studenti-bot
    container_name: polymarket-bot
    # --live only trades real money when config.json also says "trading_mode": "live"; otherwise
    # the bot refuses to start (exit 78). For paper trading, remove "--live".
    command: ["-m", "bot", "--config", "/app/config.json", "--workdir", "/data", "--live"]
    # Secrets come from .env on the host; they are not baked into the image.
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/data
    # Restart after a crash, but not after a clean exit (cutoff reached, STOP file). A setup error
    # (exit 78) is retried a few times and then left stopped; `docker compose logs` says why.
    restart: on-failure:5
    # The bot cancels its own orders on SIGTERM; give it time before Docker kills it.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: polymarket-studenti-bot
    container_name: polymarket-dashboard
    depends_on:
      - bot
    command: ["-m", "dashboard", "--data", "/data", "--host", "0.0.0.0", "--port", "8080"]
    # Read-only: the dashboard can see the bot's files but cannot change them or place orders.
    volumes:
      - ./data:/data:ro
    # Bound to the server's loopback only (SSH tunnel: ssh -L 8080:127.0.0.1:8080 root@DROPLET_IP).
    # From the web it is reached only through the caddy service below, over HTTPS with a password.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    container_name: polymarket-caddy
    # Optional: starts only with COMPOSE_PROFILES=web in .env (see README, "Dashboard on the web").
    profiles: ["web"]
    depends_on:
      - dashboard
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
